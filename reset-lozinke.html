<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova lozinka — Moj Čist Grad</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f6;font:16px system-ui,sans-serif;color:#13352e;padding:16px;box-sizing:border-box}.panel{width:min(100%,430px);background:white;border:1px solid #e1ebe5;border-radius:20px;padding:30px;box-shadow:0 12px 40px #13352e10;box-sizing:border-box}h1{font-size:26px;margin:0 0 12px}p{line-height:1.55;color:#526d64}label{display:block;font-weight:700;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbdcd3;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;background:#087e65;color:white;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#message{margin-top:16px;overflow-wrap:anywhere}a{color:#087e65}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main class="panel"><h1>🌿 Nova lozinka</h1><p>Postavi novu lozinku za administratorski račun Moj Čist Grad.</p><p id="status">Provjeravam link za oporavak…</p><form id="form" hidden><label for="password">Nova lozinka (najmanje 12 znakova)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Ponovi novu lozinku</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="save" type="submit">Sačuvaj novu lozinku</button></form><p id="message" role="status"></p><p><a href="https://stenjak.github.io/moj-cist-grad/">Povratak na Moj Čist Grad</a></p></main>
<script>
'use strict';
const db=window.supabase.createClient('https://kkyexchfyhogqtcfvvau.supabase.co','sb_publishable_s6cFZS1SpjxzHT_J1yTThQ_JyilPS1-',{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
const status=document.getElementById('status'),form=document.getElementById('form'),message=document.getElementById('message');
let recoveryConfirmed=false;
const hasRecoveryLink=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery'||new URLSearchParams(location.search).get('type')==='recovery'||new URLSearchParams(location.search).has('code');
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryConfirmed=true;form.hidden=false;status.textContent='Link je potvrđen. Unesi novu lozinku.';history.replaceState(null,'',location.pathname)}});
(async()=>{try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session&&hasRecoveryLink){recoveryConfirmed=true;form.hidden=false;status.textContent='Link je potvrđen. Unesi novu lozinku.';history.replaceState(null,'',location.pathname)}else if(!recoveryConfirmed){status.textContent='Otvori ovu stranicu putem novog linka za resetovanje lozinke iz e-maila.'}}catch{status.textContent='Link nije važeći ili je istekao. Zatraži novi link iz Supabasea.'}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryConfirmed)return;const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){message.textContent='Lozinke se ne podudaraju.';return}const btn=document.getElementById('save');btn.disabled=true;message.textContent='Spremam…';try{const {error}=await db.auth.updateUser({password});if(error)throw error;message.textContent='Lozinka je uspješno promijenjena. Sada se možeš prijaviti u administraciju.';form.hidden=true;await db.auth.signOut({scope:'global'});status.textContent='Gotovo!'}catch{message.textContent='Promjena nije uspjela. Zatraži novi link i pokušaj ponovo.'}finally{btn.disabled=false}});
</script></body></html>
